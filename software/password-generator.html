<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Password Generator</title>
    <script>
        const lowerChars = "abcdefghijklmnopqrstuvwxyz";
        const upperChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const numberChars = "0123456789";

        function getRandomInt(max) {
            return Math.floor(Math.random() * max);
        }

        function generateStrongPassword() {
            let randomPositions = new Uint8Array(19);
            self.crypto.getRandomValues(randomPositions);
            randomPositions = [...randomPositions];

            const numberChar = numberChars[randomPositions.pop() % numberChars.length];

            let password = randomPositions.map(x => lowerChars[x % lowerChars.length]);

            const numPosition = 6 * (1 + getRandomInt(2)) - getRandomInt(2);
            password[numPosition] = numberChar;

            let upperPosition;

            do {
                upperPosition = getRandomInt(password.length);
            } while (upperPosition == numPosition);

            password[upperPosition] = password[upperPosition].toUpperCase()

            password = password.join("").match(/[0-9A-Za-z]{6}/g).join("-");

            document.getElementById("strong-password").value = password;
        }

        function generatePassword() {
            const length = parseInt(document.getElementById("length").value);
            const useLower = document.getElementById("lowercase").checked;
            const useUpper = document.getElementById("uppercase").checked;
            const useNumbers = document.getElementById("numbers").checked;
            const useSymbols = document.getElementById("symbols").checked;
            const symbolChars = document.getElementById("symbol-chars").value;

            let allChars = "";
            let requiredChars = [];

            if (useLower) {
                allChars += lowerChars;
                requiredChars.push(lowerChars[getRandomInt(lowerChars.length)]);
            }
            if (useUpper) {
                allChars += upperChars;
                requiredChars.push(upperChars[getRandomInt(upperChars.length)]);
            }
            if (useNumbers) {
                allChars += numberChars;
                requiredChars.push(numberChars[getRandomInt(numberChars.length)]);
            }
            if (useSymbols) {
                allChars += symbolChars;
                requiredChars.push(symbolChars[getRandomInt(symbolChars.length)]);
            }

            if (allChars.length === 0) {
                alert("Please select at least one character type.");
                return;
            }

            let password = requiredChars;

            for (let i = requiredChars.length; i < length; i++) {
                password.push(allChars[getRandomInt(allChars.length)]);
            }

            password = password.sort(() => Math.random() - 0.5).join("");

            document.getElementById("password").value = password;
        }
    </script>
</head>
<body>
    <h1>Password Generator</h1>
    <h2>The field asking the user for a new password</h2>
    <input type="password" autocomplete="new-password">

    <h2>Generate a new strong password using JavaScript</h2>
    <button onclick="generateStrongPassword()">Generate</button><br>
    <input type="text" id="strong-password" readonly>

    <h2>Generate a new password using JavaScript</h2>
    <label>Length: <input type="number" id="length" min="4" max="50" value="8"></label><br>
    <label><input type="checkbox" id="lowercase" checked>Lowercase</label><br>
    <label><input type="checkbox" id="uppercase" checked>Uppercase</label><br>
    <label><input type="checkbox" id="numbers" checked>Numbers</label><br>
    <label><input type="checkbox" id="symbols">Symbols</label> <input type="text" id="symbol-chars" value="!@#$%^&*()_+-=[]{}|;:,.<>?"><br>
    <button onclick="generatePassword()">Generate</button><br>
    <input type="text" id="password" readonly>
</body>
</html>
